<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard de frequência dos alunos." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Aplica o tema escolhido antes do primeiro desenho, para a página não piscar no outro tema.
         Mesma chave e valores de src/utils/themePreference.ts. -->
    <script>
      try {
        var tema = localStorage.getItem("secreta:tema");
        if (tema === "claro" || tema === "escuro") {
          document.documentElement.dataset.theme = tema === "escuro" ? "dark" : "light";
        }
      } catch (e) {}
    </script>
    <title>Dashboard · SECRETA</title>
    <!-- Prepara em segundo plano a página do item da barra sob o mouse; ela abre quase na hora.
         O Dashboard busca a planilha inteira, então só é preparado no clique. -->
    <script type="speculationrules">
      {
        "prerender": [
          { "where": { "selector_matches": "nav a:not([href*='frequencia'])" }, "eagerness": "moderate" },
          { "where": { "selector_matches": "nav a[href*='frequencia']" }, "eagerness": "conservative" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/frequencia/main.tsx"></script>
  </body>
</html>
